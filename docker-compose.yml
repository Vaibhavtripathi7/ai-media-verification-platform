services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verify
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "verify"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build: apps/inference
    environment:
      INFERENCE_THREADS: ${INFERENCE_THREADS:-4}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/verify
      INFERENCE_URL: http://inference:8000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy

volumes:
  postgres:
